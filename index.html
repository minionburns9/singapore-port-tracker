<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Singapore Port Tracker</title>

  <link rel="stylesheet" href="/style.css?v=3">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">

  <style>
    #logBox {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 180px;
      background: #000;
      color: #00ff9c;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      padding: 10px;
      z-index: 9999;
      border-top: 2px solid #00ff9c;
    }
  </style>
</head>

<body>

  <div id="sidebar">
    <h1>Singapore Port Tracker</h1>
    <p class="subtitle">Singapore Strait vessel traffic prototype</p>

    <div class="card">
      <h2>Live Metrics</h2>
      <div class="metric"><span>Total Ships</span><strong id="total_ships">-</strong></div>
      <div class="metric"><span>Tankers</span><strong id="tankers">-</strong></div>
      <div class="metric"><span>Cargo</span><strong id="cargo">-</strong></div>
      <div class="metric"><span>Anchored</span><strong id="anchored">-</strong></div>
      <div class="metric"><span>Congestion</span><strong id="congestion">-</strong></div>
    </div>

    <div class="card">
      <h2>Status</h2>
      <p>Debug logging enabled below.</p>
    </div>
  </div>

  <div id="map"></div>

  <!-- LOG BOX -->
  <div id="logBox"></div>

  <!-- LOGGING SCRIPT -->
  <script>
    const logBox = document.getElementById("logBox");

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      const line = `[${time}] ${msg}`;
      console.log(line);
      logBox.innerHTML += line + "<br>";
      logBox.scrollTop = logBox.scrollHeight;
    }

    log("Page loaded");

    window.onerror = function (msg, url, line, col, error) {
      log("ERROR: " + msg);
    };

    window.addEventListener("unhandledrejection", function (event) {
      log("PROMISE ERROR: " + event.reason);
    });

    // Check Mapbox loaded
    if (typeof mapboxgl === "undefined") {
      log("Mapbox library FAILED to load");
    } else {
      log("Mapbox library loaded");
    }

    // Test config endpoint
    fetch("/config")
      .then(res => res.json())
      .then(data => {
        if (!data.mapbox_token) {
          log("Mapbox token MISSING from /config");
        } else {
          log("Mapbox token RECEIVED");
        }
      })
      .catch(err => {
        log("Config fetch FAILED: " + err);
      });
  </script>

  <script src="/app.js?v=3"></script>

</body>
</html>
