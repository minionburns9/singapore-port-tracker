<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Singapore Port Tracker</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #ffffff;
      overflow: hidden;
    }

    #appShell {
      position: fixed;
      inset: 0;
      display: flex;
      background: #07111f;
    }

    #sidebar {
      width: 340px;
      height: calc(100vh - 190px);
      background: #0a1626;
      padding: 18px;
      overflow-y: auto;
      box-shadow: 8px 0 25px rgba(0, 0, 0, 0.35);
      z-index: 10;
    }

    #map {
      flex: 1;
      height: calc(100vh - 190px);
      min-height: 400px;
      background: #07111f;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #9fb3c8;
      margin: 0 0 18px;
      line-height: 1.4;
    }

    .card {
      background: #13263c;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    .card h2 {
      font-size: 16px;
      margin: 0 0 12px;
      color: #9ed8ff;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
    }

    .metric:last-child { border-bottom: none; }

    .metric strong {
      color: #79d7ff;
      text-align: right;
      max-width: 170px;
      overflow-wrap: anywhere;
    }

    .legend {
      display: flex;
      align-items: center;
      margin: 7px 0;
      color: #d8e6f3;
      font-size: 14px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      display: inline-block;
      margin-right: 8px;
      border: 1px solid #ffffff;
    }

    .cargo { background: #3aa0ff; }
    .tanker { background: #ff4d4d; }
    .tug { background: #ffd166; }
    .passenger { background: #9dff7a; }

    #logBox {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 190px;
      background: #000000;
      color: #00ff9c;
      font-family: monospace;
      font-size: 12px;
      overflow-y: auto;
      padding: 10px;
      z-index: 9999;
      border-top: 2px solid #00ff9c;
    }

    .error-box {
      color: white;
      background: #8b1e1e;
      padding: 20px;
      margin: 20px;
      border-radius: 10px;
      font-size: 16px;
    }

    .mapboxgl-popup-content {
      color: #111111;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      #appShell { flex-direction: column; }

      #sidebar {
        width: 100%;
        height: 360px;
      }

      #map {
        width: 100%;
        height: calc(100vh - 550px);
        min-height: 260px;
      }
    }
  </style>
</head>

<body>
  <div id="appShell">
    <div id="sidebar">
      <h1>Singapore Port Tracker</h1>
      <p class="subtitle">Live AISStream vessel traffic for Singapore Strait</p>

      <div class="card">
        <h2>Live Metrics</h2>
        <div class="metric"><span>Total Ships</span><strong id="total_ships">-</strong></div>
        <div class="metric"><span>Tankers</span><strong id="tankers">-</strong></div>
        <div class="metric"><span>Cargo</span><strong id="cargo">-</strong></div>
        <div class="metric"><span>Anchored</span><strong id="anchored">-</strong></div>
        <div class="metric"><span>Congestion</span><strong id="congestion">-</strong></div>
      </div>

      <div class="card">
        <h2>AISStream Status</h2>
        <div class="metric"><span>Mode</span><strong id="ais_mode">-</strong></div>
        <div class="metric"><span>Connected</span><strong id="ais_connected">-</strong></div>
        <div class="metric"><span>Messages</span><strong id="ais_messages">-</strong></div>
        <div class="metric"><span>Last Message</span><strong id="ais_last_message">-</strong></div>
        <div class="metric"><span>Error</span><strong id="ais_error">-</strong></div>
      </div>

      <div class="card">
        <h2>Legend</h2>
        <div class="legend"><span class="dot cargo"></span>Cargo</div>
        <div class="legend"><span class="dot tanker"></span>Tanker</div>
        <div class="legend"><span class="dot tug"></span>Tug</div>
        <div class="legend"><span class="dot passenger"></span>Passenger / Other</div>
      </div>
    </div>

    <div id="map"></div>
  </div>

  <div id="logBox"></div>

  <script>
    const logBox = document.getElementById("logBox");

    function appLog(message) {
      const time = new Date().toLocaleTimeString();
      const line = `[${time}] ${message}`;
      console.log(line);
      logBox.innerHTML += line + "<br>";
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.appLog = appLog;

    appLog("index.html loaded");
    appLog("Map container exists: " + Boolean(document.getElementById("map")));
    appLog("Mapbox library status: " + (typeof mapboxgl !== "undefined" ? "loaded" : "missing"));

    window.onerror = function (msg, url, line, col, error) {
      appLog("WINDOW ERROR: " + msg + " at line " + line);
    };

    window.addEventListener("unhandledrejection", function (event) {
      appLog("PROMISE ERROR: " + event.reason);
    });
  </script>

  <script src="/app.js?v=30"></script>
</body>
</html>
