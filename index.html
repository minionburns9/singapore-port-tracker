<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Singapore Port Tracker</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet">
</head>

<body>

<div id="sidebar">
  <h1>Singapore Port Tracker</h1>

  <div class="card">
    <h2>Metrics</h2>
    <div>Total Ships: <span id="total_ships">-</span></div>
    <div>Tankers: <span id="tankers">-</span></div>
    <div>Cargo: <span id="cargo">-</span></div>
    <div>Anchored: <span id="anchored">-</span></div>
    <div>Congestion: <span id="congestion">-</span></div>
  </div>
</div>

<div id="map"></div>

<script src="app.js"></script>

</body>
</html>
