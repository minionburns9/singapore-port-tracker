<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Singapore Port Tracker</title>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: Arial, sans-serif;
      background: #07111f;
      color: #ffffff;
    }

    #appShell {
      position: fixed;
      inset: 0;
      display: flex;
      background: #07111f;
    }

    #sidebar {
      width: 340px;
      height: 100vh;
      background: #0a1626;
      padding: 16px;
      overflow-y: auto;
      box-shadow: 6px 0 20px rgba(0,0,0,0.3);
      z-index: 10;
    }

    #map {
      flex: 1;
      height: 100vh;
    }

    h1 {
      font-size: 20px;
      margin: 0 0 6px;
    }

    .subtitle {
      color: #9fb3c8;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .card {
      background: #13263c;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .card h2 {
      font-size: 14px;
      margin: 0 0 8px;
      color: #9ed8ff;
    }

    .metric {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .metric:last-child { border-bottom: none; }

    .metric strong {
      color: #79d7ff;
    }

    .legend {
      display: flex;
      align-items: center;
      font-size: 13px;
      margin: 5px 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid #fff;
    }

    .cargo { background: #3aa0ff; }
    .tanker { background: #ff4d4d; }
    .tug { background: #ffd166; }
    .passenger { background: #9dff7a; }

    /* MOBILE MODE */
    @media (max-width: 768px) {
      #appShell {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        height: auto;
        max-height: 260px;
        overflow-y: auto;
      }

      #map {
        height: calc(100vh - 260px);
      }

      h1 {
        font-size: 18px;
      }

      .subtitle {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div id="appShell">

    <div id="sidebar">
      <h1>Singapore Port Tracker</h1>
      <div class="subtitle">Live AISStream vessel traffic</div>

      <div class="card">
        <h2>Live Metrics</h2>
        <div class="metric"><span>Total Ships</span><strong id="total_ships">-</strong></div>
        <div class="metric"><span>Tankers</span><strong id="tankers">-</strong></div>
        <div class="metric"><span>Cargo</span><strong id="cargo">-</strong></div>
        <div class="metric"><span>Anchored</span><strong id="anchored">-</strong></div>
        <div class="metric"><span>Congestion</span><strong id="congestion">-</strong></div>
      </div>

      <div class="card">
        <h2>AISStream</h2>
        <div class="metric"><span>Status</span><strong id="ais_mode">-</strong></div>
        <div class="metric"><span>Connected</span><strong id="ais_connected">-</strong></div>
        <div class="metric"><span>Messages</span><strong id="ais_messages">-</strong></div>
      </div>

      <div class="card">
        <h2>Legend</h2>
        <div class="legend"><span class="dot cargo"></span>Cargo</div>
        <div class="legend"><span class="dot tanker"></span>Tanker</div>
        <div class="legend"><span class="dot tug"></span>Tug</div>
        <div class="legend"><span class="dot passenger"></span>Other</div>
      </div>
    </div>

    <div id="map"></div>

  </div>

  <script src="/app.js"></script>
</body>
</html>
